<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incrementalist</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game-canvas" aria-label="Incrementalist game canvas"></canvas>

      <section class="hud" aria-label="Game controls">
        <div class="title-block">
          <p class="eyebrow">Incrementalist</p>
          <h1>Press. Store. Repeat.</h1>
        </div>

        <label class="username-field" for="username-input">
          <span>Username</span>
          <input id="username-input" name="username" maxlength="40" autocomplete="off" />
        </label>

        <div class="counter" aria-live="polite">
          <span id="click-count">0</span>
          <span>clicks</span>
        </div>

        <button id="click-button" type="button">Click</button>
        <p id="status-line" class="status-line" role="status"></p>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
