<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incrementalist</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="game-shell" style="position: relative;">
      <canvas id="game-canvas" width="1280" height="760" aria-label="Incrementalist game canvas" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
      <canvas id="effects-canvas" width="1280" height="760" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none;"></canvas>

      <section class="hud" aria-label="Game controls">
        <div class="title-block">
          <p class="eyebrow">Incrementalist</p>
          <h1>Game</h1>
        </div>

        <p id="status-line" class="status-line" role="status">Connecting...</p>

        <div class="stats" aria-live="polite">
          <div class="stat">
            <span>Level</span>
            <strong id="level-value">1</strong>
          </div>
          <div class="stat">
            <span>File</span>
            <strong id="slot-value">1</strong>
          </div>
        </div>

        <div class="actions">
          <button id="noop-button" type="button">Sync</button>
          <button id="save-button" type="button">Files</button>
          <button id="reset-button" type="button">Reset</button>
        </div>

        <div id="slot-list" class="slot-list" aria-label="Save files"></div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
