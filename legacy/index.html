<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incrementalist</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--app-bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #gameStage {
            box-sizing: border-box;
            position: relative;
            width: min(100vw, calc(100vh * (1280 / 760)));
            height: min(100vh, calc(100vw * (760 / 1280)));
            border: 2px solid var(--canvas-border-color);
            box-shadow: 0 0 20px var(--canvas-shadow-color);
        }

        #gameCanvas,
        #effectsCanvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            z-index: 1;
        }

        #effectsCanvas {
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <div id="gameStage">
        <canvas id="gameCanvas" width="1280" height="760"></canvas>
        <canvas id="effectsCanvas" width="1280" height="760" aria-hidden="true"></canvas>
    </div>
    <script type="module" src="./game/game.js"></script>
</body>
</html>
