<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rarity Colors</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .rarities {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .rarity {
      font-size: 40px;
      font-weight: 700;
    }

    .tier-1 { color: #ffffff; }
    .tier-2 { color: #56a8ff; }
    .tier-3 { color: #52df87; }
    .tier-4 { color: #ba77ff; }
    .tier-5 { color: #ff5b8f; }
    .tier-6 { color: #40e0d0; }
    .tier-7 { color: #ffbe4d; }
  </style>
</head>
<body>
  <main class="rarities">
    <div class="rarity tier-1">Common</div>
    <div class="rarity tier-2">Rare</div>
    <div class="rarity tier-3">Excellent</div>
    <div class="rarity tier-4">Supreme</div>
    <div class="rarity tier-5">Legendary</div>
    <div class="rarity tier-6">Celestial</div>
    <div class="rarity tier-7">Divine</div>
  </main>
</body>
</html>
